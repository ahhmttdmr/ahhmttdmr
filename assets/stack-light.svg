<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-label="Teknoloji yığını">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
    .fg { fill: #1F2328; }
    .muted { fill: #59636E; }
    .accent { fill: #4F46E5; }
    .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    .wave { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s ease-out forwards; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .wave { animation: none; stroke-dashoffset: 0; }
    }
  </style>
